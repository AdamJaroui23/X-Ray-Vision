# Temporary helper: builds the remapped JAR and commits it to dist/ so it can be
# retrieved through the GitHub contents API from a network-restricted sandbox.
# This workflow is only runnable manually and will be deleted once the JAR is delivered.
name: Publish JAR

on:
  push:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build remapped JAR
        run: ./gradlew remapJar --console=plain

      - name: Commit JAR to dist/
        run: |
          mkdir -p dist
          cp "build/libs/$(ls build/libs | grep '\.jar$' | grep -v -- '-sources' | head -1)" dist/xrayvision-1.0.0.jar
          git config user.name "xray-ci"
          git config user.email "xray-ci@users.noreply.github.com"
          git add -f dist
          git commit -m "chore(temp): publish built jar [skip ci]" || true
          git push origin "HEAD:$GITHUB_REF_NAME" || true
