name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Loom 1.18 runs on Java 25. The mod bytecode is still emitted for Java 21 (Minecraft 1.21.11).
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (includes unit tests)
        run: |
          ./gradlew build --stacktrace --console=plain 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: Verify JAR contents
        run: |
          {
            echo "=== JAR VERIFICATION ==="
            ls -la build/libs
            JAR="build/libs/$(ls build/libs | grep '\.jar$' | grep -v -- '-sources' | head -1)"
            echo "Main JAR: $JAR (size: $(stat -c%s "$JAR") bytes)"
            echo "--- total entries ---"
            unzip -l "$JAR" | tail -1
            echo "--- .class entries ---"
            unzip -l "$JAR" | grep -c '\.class' || true
            echo "--- key resources ---"
            unzip -l "$JAR" | grep -E 'fabric.mod.json|mixins.json|icon.png|en_us.json' || true
            echo "--- key classes ---"
            unzip -l "$JAR" | grep -E 'XRayVisionClient|BlockBehaviourMixin|XRayHighlightRenderer|OreHighlightCache' || true
            echo "--- fabric.mod.json ---"
            unzip -p "$JAR" fabric.mod.json
          } 2>&1 | tee -a ci-build.log

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X-Ray-Vision
          path: build/libs/*.jar

      - name: Publish build log for review
        if: always()
        continue-on-error: true
        run: |
          git config user.name "xray-ci"
          git config user.email "xray-ci@users.noreply.github.com"
          git add -f ci-build.log
          if git diff --cached --quiet; then
            echo "Build log unchanged."
          else
            git commit -m "chore: publish CI build log [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" || true
          fi
