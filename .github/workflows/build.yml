name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Loom 1.18 runs on Java 25. The mod bytecode is still emitted for Java 21 (Minecraft 1.21.11).
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (includes unit tests)
        run: |
          ./gradlew build --stacktrace --console=plain 2>&1 | tee ci-build.log
          exit ${PIPESTATUS[0]}

      - name: Publish build log for review
        if: always()
        run: |
          git config user.name "xray-ci"
          git config user.email "xray-ci@users.noreply.github.com"
          git add -f ci-build.log
          if git diff --cached --quiet; then
            echo "Build log unchanged."
          else
            git commit -m "chore: publish CI build log [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X-Ray-Vision
          path: build/libs/*.jar
