name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Loom 1.18 runs on Java 25. The mod bytecode is still emitted for Java 21 (Minecraft 1.21.11).
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (includes unit tests)
        run: ./gradlew build --stacktrace --console=plain

      - name: Verify JAR contents
        run: |
          ls -la build/libs
          JAR="build/libs/$(ls build/libs | grep '\.jar$' | grep -v -- '-sources' | head -1)"
          echo "Main JAR: $JAR (size: $(stat -c%s "$JAR") bytes)"
          echo "--- total entries ---"
          unzip -l "$JAR" | tail -1
          echo "--- .class entries ---"
          unzip -l "$JAR" | grep -c '\.class' || true
          echo "--- key resources ---"
          unzip -l "$JAR" | grep -E 'fabric.mod.json|mixins.json|icon.png|en_us.json' || true
          echo "--- mod id ---"
          unzip -p "$JAR" fabric.mod.json | grep '"id"'

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: X-Ray-Vision
          path: build/libs/*.jar

      # TEMPORARY diagnostics step - remove once the build is green.
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ./gradlew build --stacktrace --continue > build-out.txt 2>&1 || true
          sed -n '1,1500p' build-out.txt > build-tail.txt
          git config user.name "Arena Agent"
          git config user.email "arena@users.noreply.github.com"
          git add -f build-tail.txt
          git commit -m "chore(ci): publish build log for ${{ github.run_id }} [skip ci]" || echo "no changes"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || echo "push failed"
