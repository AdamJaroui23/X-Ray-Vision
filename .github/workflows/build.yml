name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          # Loom 1.18 runs on Java 25. The mod bytecode is still emitted for Java 21 (Minecraft 1.21.11).
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle (includes unit tests)
        run: ./gradlew build --stacktrace

      - name: Report test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/**

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: X-Ray-Vision
          path: build/libs/*.jar
